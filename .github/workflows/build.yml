name: build

# The build must reproduce the committed files exactly (README: "The build is deterministic").
# Each Python version runs in the official Python image, which also carries git: GitHub's own
# runners no longer offer Python 3.9, the oldest version the README promises.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: python:${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - name: Let git work in the checked-out folder (owned by another user inside the container)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Cache the GRETIL mirror (keyed on the pinned commit)
        uses: actions/cache@v4
        with:
          path: mirror
          key: gretil-mirror-${{ hashFiles('corrections.json') }}
          restore-keys: gretil-mirror-
      - name: Build
        run: python --version && python build.py
      - name: The built files are the committed ones
        run: |
          git status --porcelain -- corrected index.html
          test -z "$(git status --porcelain -- corrected index.html)"
